<body>

<center>

<div id="home-page">

</div>

</div>

<div id="fav-page" style="display:none">
<h2 class="fav-text">В избранном пусто</h2>
<h4 class="favsub-text">Добавляйте понравившиеся товары в избранное, чтобы не потерять </h4>

<button class="gotopurchases" onclick="document.querySelector('[data-page=\'home\']').click()">

<div class="bottom-nav">

<div class="bottom-nav">
    <button class="nav-item active" data-page="home">
<div class="icon">
    <i class="fa-solid fa-house"></i>
</div>
        <span>Главная</span>
    </button>

    <button class="nav-item" data-page="fav">
       <div class="icon">

</div>

    <button class="nav-item" data-page="cart">
<div class="icon">

</div>

    </button>

    <button class="nav-item" data-page="profile">
<div class="icon">
    <i class="fa-solid fa-user"></i>
</div>
        <span>Профиль</span>
    </button>
</div>

</center>
<script>

const tabs = document.querySelectorAll('.nav-item');

tabs.forEach(tab => {
    tab.addEventListener('click', () => {

        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.getElementById('home-page').style.display = 'none';
        document.getElementById('fav-page').style.display = 'none';
        document.getElementById('cart-page').style.display = 'none';
        document.getElementById('profile-page').style.display = 'none';

        document.getElementById(tab.dataset.page + '-page').style.display = 'block';
    });
});
</script>
